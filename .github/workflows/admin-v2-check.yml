name: Admin V2 Check

on:
  pull_request:
    paths:
      - "admin.html"
      - "admin-data.js"
      - "admin-v2-page.js"
      - "admin-v2.css"
      - "admin-v2-controls.css"
      - "site-v2.css"
      - "scripts/**"
      - "docs/ADMIN_V2_PLAN.md"
      - "docs/POCKETBASE_SCHEMA_V1.md"
      - "docs/ADMIN_V2_CHECKPOINT.md"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check admin-data.js
          node --check admin-v2-page.js
          node --check scripts/build.mjs
          node --check scripts/build-public.mjs
          node --check scripts/validate-admin-v2.mjs
          node --check scripts/validate-public-build.mjs
          node --check scripts/test-admin-data.mjs
          node --check scripts/test-pocketbase-driver.mjs
          node --check scripts/test-pocketbase-integration.mjs
          node --check scripts/test-admin-auth.mjs

      - name: Test and validate Admin V2
        run: npm test

      - name: Build static site
        run: npm run build

      - name: Build public site without Admin
        run: npm run build:public

      - name: Verify admin output
        run: |
          test -f dist/admin.html
          test -f dist/admin-data.js
          test -f dist/admin-v2-page.js
          test -f dist/admin-v2.css
          test -f dist/admin-v2-controls.css
          test -f dist/site-v2.css
          test -f dist/admin-auth.js
          test -f dist/admin-runtime-config-loader.js
          test ! -e dist-public/admin.html
          test ! -e dist-public/admin-data.js
